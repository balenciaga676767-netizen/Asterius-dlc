
name: Build ASTERIUS dlc

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install customtkinter keyboard pyautogui pyinstaller pillow

      - name: Make icon
        run: python colorbot_gui.py --make-icon

      - name: Build exe
        run: pyinstaller --onefile --noconsole --icon asterius.ico --collect-all customtkinter --name ASTERIUS_dlc colorbot_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: ASTERIUS_dlc
          path: dist/ASTERIUS_dlc.exe
          
